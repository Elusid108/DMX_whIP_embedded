# whip.cfg - copy to the root of the SD card of an RP2040 / RP2350 player.
# Read each time the card is mounted. Nothing here is saved on the board:
# take the file away and the board's own settings come back.
# Remove the "#" in front of a line to use it.

name=Stage-01

# Brightness, 0-255.
bri=32

# Patch of the first LED output. The clips on a card are recorded per
# universe, so set the universe they were made for (sACN is one higher).
uni=3
ch=1
count=64
order=grb
chip=ws2812b

# LED pins as GPIO numbers. XIAO RP2040 / RP2350: D0 = 26, D1 = 27.
#data=26
#clk=27

# What to play: root (every clip in the card's root), none,
# file:/scene_4.dmx or folder:/shows
play=root

# For play=file: all plays the list, one repeats that file.
#loop=all

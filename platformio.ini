[platformio]
default_envs = matrix

[esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/gzip_portal.py
lib_deps =
	fastled/FastLED@3.10.3

[env:matrix]
extends = esp32
custom_release = yes
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
; Two 1.875 MB app slots for OTA plus a 128 KB config partition. Changing
; the table needs one USB flash (Flash tab); after that updates go over the air.
board_build.partitions = partitions/whip_4mb.csv
board_build.arduino.memory_type = qio_qspi
build_flags =
	-DBOARD_PROFILE_MATRIX
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

[env:c5]
extends = esp32
custom_release = yes
board = esp32-c5-devkitc1-n8r4
; 48 MHz crystal. ROM boot in QIO reads the next image block as 0xFF and
; resets before the app. DIO at 40 MHz is what the ROM can load.
board_build.flash_mode = dio
board_build.f_flash = 40000000L
build_flags =
	-DBOARD_PROFILE_C5
	-DBOARD_HAS_PSRAM

[env:xiao-c5]
extends = esp32
custom_release = yes
board = seeed_xiao_esp32c5
; 48 MHz crystal. ROM boot in QIO reads the next image block as 0xFF and
; resets before the app. DIO at 40 MHz is what the ROM can load.
board_build.flash_mode = dio
board_build.f_flash = 40000000L
build_flags =
	-DBOARD_PROFILE_XIAO_C5

[env:xiao-s3]
extends = esp32
custom_release = yes
board = seeed_xiao_esp32s3
; 8 MB QIO flash + 8 MB OPI PSRAM (board json: qio_opi, USB CDC on boot).
board_build.partitions = partitions/whip_8mb.csv
build_flags =
	-DBOARD_PROFILE_XIAO_S3
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

[env:xiao-c3]
extends = esp32
custom_release = yes
board = seeed_xiao_esp32c3
; 4 MB flash, no PSRAM, native USB CDC. Same OTA layout as the Matrix.
board_build.partitions = partitions/whip_4mb.csv
build_flags =
	-DBOARD_PROFILE_XIAO_C3
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

[env:xiao-c6]
extends = esp32
custom_release = yes
board = seeed_xiao_esp32c6
; 4 MB flash, no PSRAM, native USB CDC. Same OTA layout as the Matrix.
board_build.partitions = partitions/whip_4mb.csv
build_flags =
	-DBOARD_PROFILE_XIAO_C6
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

; RP2040 / RP2350 standalone player (no radio): SD playback + LEDs, flashed
; and updated over USB (UF2), set up by the companion over USB serial.
; Earle Philhower's Arduino core via maxgerhardt's platform.
[rp]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
monitor_speed = 115200
lib_deps =
	fastled/FastLED@3.10.3
; Its Preferences.h would shadow include/compat_rp/Preferences.h.
lib_ignore = iLabs Hearth
build_flags =
	-DWHIP_HAS_NET=0
	-DPIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
	-Iinclude/compat_rp
	-include include/compat_rp/whip_rp.h
; Network, OTA, live input, sync, the console fixture and the ESP clocked
; LED driver stay out; src/rp_stubs.cpp answers for them. LEDs go out through
; PIO (led_out_rp.cpp, clocked_tx_rp.cpp).
build_src_filter =
	+<*>
	-<artnet_rx.cpp>
	-<sacn_rx.cpp>
	-<live_input.cpp>
	-<sync.cpp>
	-<sync_net.cpp>
	-<show_net.cpp>
	-<distribute.cpp>
	-<ota.cpp>
	-<wifi_setup.cpp>
	-<net_http.cpp>
	-<clocked_tx.cpp>
	-<fixture.cpp>

[env:xiao-rp2040]
extends = rp
board = seeed_xiao_rp2040
build_flags =
	${rp.build_flags}
	-DBOARD_PROFILE_XIAO_RP2040

[env:xiao-rp2350]
extends = rp
board = seeed_xiao_rp2350
build_flags =
	${rp.build_flags}
	-DBOARD_PROFILE_XIAO_RP2350
